[package]
name = "bandcomic-v4-runtime-check"
version = "0.1.0"
edition = "2024"

[dependencies]
wasmtime = { version = "=48.0.2", default-features = false, features = ["std", "runtime", "cranelift", "async", "component-model", "component-model-async"] }
wasmtime-wasi = { version = "=48.0.2", features = ["p2", "p3"] }
wasmtime-wasi-http = { version = "=48.0.2", features = ["p2", "p3", "component-model-async"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
tempfile = "3"
